name: churchtools-chat-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${CT_CHAT_DB_PASSWORD:-nextcloud-dev-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  custom-apps-init:
    image: ${CT_CHAT_NEXTCLOUD_IMAGE:-nextcloud:34-apache}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 33:33 /var/www/html/custom_apps"]
    restart: "no"
    volumes:
      - nextcloud_custom_apps:/var/www/html/custom_apps

  app:
    image: ${CT_CHAT_NEXTCLOUD_IMAGE:-nextcloud:34-apache}
    restart: unless-stopped
    ports:
      - "${CT_CHAT_BIND_ADDRESS:-127.0.0.1}:${CT_CHAT_HTTP_PORT:-8080}:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${CT_CHAT_DB_PASSWORD:-nextcloud-dev-db}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${CT_CHAT_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${CT_CHAT_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: ${CT_CHAT_TRUSTED_DOMAINS:-localhost 127.0.0.1}
      NEXTCLOUD_INIT_HTACCESS: "true"
      CT_CHAT_SMART_PICKER_APPS: ${CT_CHAT_SMART_PICKER_APPS-deck spreed tables integration_openstreetmap}
    depends_on:
      custom-apps-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_custom_apps:/var/www/html/custom_apps
      - ./:/var/www/html/custom_apps/churchtools_chat:ro
      - ./docker/before-starting/10-enable-churchtools-chat.sh:/docker-entrypoint-hooks.d/before-starting/10-enable-churchtools-chat.sh:ro
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(str_contains((string) @file_get_contents("http://127.0.0.1/status.php"), "\"installed\":true") ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  nextcloud_html:
  nextcloud_custom_apps:
  postgres_data:
