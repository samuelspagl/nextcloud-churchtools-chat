name: Publish to Nextcloud App Store

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        type: string
      nightly:
        description: Publish as a nightly release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    if: >-
      vars.APPSTORE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'))
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - name: Select release
        id: release
        run: |
          if [[ "${{ github.event_name }}" == 'release' ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "nightly=${{ github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == 'workflow_run' ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "nightly=${{ inputs.nightly }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
      - name: Derive and verify release tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -e "const fs=require('fs'); const xml=fs.readFileSync('appinfo/info.xml','utf8'); const match=xml.match(/<version>\\s*([^<\\s]+)\\s*<\\/version>/); if (!match) process.exit(1); process.stdout.write(match[1])")"
          TAG="v$VERSION"
          if [[ -n '${{ steps.release.outputs.tag }}' && '${{ steps.release.outputs.tag }}' != "$TAG" ]]; then
            echo 'Selected tag does not match appinfo/info.xml.' >&2
            exit 1
          fi
          git fetch --tags --force
          test "$(git rev-parse "$TAG^{}")" = "$GITHUB_SHA"
          gh release view "$TAG" >/dev/null
          if [[ '${{ github.event_name }}' == 'workflow_run' ]]; then
            NIGHTLY="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
          else
            NIGHTLY='${{ steps.release.outputs.nightly }}'
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "nightly=$NIGHTLY" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production assets
        run: pnpm build
      - name: Validate signing credentials
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          CERT_DIR="$RUNNER_TEMP/nextcloud-certificates"
          mkdir -p "$CERT_DIR"
          printf '%s' "$APP_PRIVATE_KEY" > "$CERT_DIR/churchtools_chat.key"
          printf '%s' "$APP_PUBLIC_CRT" > "$CERT_DIR/churchtools_chat.crt"
          chmod 600 "$CERT_DIR/churchtools_chat.key"
          openssl rsa -in "$CERT_DIR/churchtools_chat.key" -check -noout
          openssl x509 -in "$CERT_DIR/churchtools_chat.crt" -noout -subject | grep -q 'CN = churchtools_chat'
      - name: Create App Store archive
        id: archive
        run: |
          ARCHIVE="$GITHUB_WORKSPACE/churchtools_chat-${{ steps.target.outputs.tag }}.tar.gz"
          scripts/package-appstore.sh "$ARCHIVE"
          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
      - name: Attach archive to GitHub release
        id: upload
        uses: svenstaro/upload-release-action@483c1e56f95e88835747b1c7c60581215016cbf2
        with:
          repo_token: ${{ github.token }}
          file: ${{ steps.archive.outputs.path }}
          asset_name: ${{ steps.archive.outputs.name }}
          tag: ${{ steps.target.outputs.tag }}
          overwrite: true
      - name: Publish to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@a011fe619bcf6e77ddebc96f9908e1af4071b9c1
        with:
          app_name: churchtools_chat
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.upload.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ steps.target.outputs.nightly }}
